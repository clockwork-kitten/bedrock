name: CI

on:
  push:
    branches: [main]
    tags: ['eslint-config-bedrock@*']
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  publish-eslint-config:
    name: Publish eslint-config-bedrock
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/eslint-config-bedrock@')
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish --access public
        working-directory: packages/eslint-config-bedrock
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
